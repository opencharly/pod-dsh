version: 2026.261.1747
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
import:
    # The canonical fedora builder chain, flat-imported so the npm builder
    # carries the RPM Fusion repos (codec-devel packages: ffmpeg-devel /
    # x264-devel) that build-toolchain installs. Flat import of the three box
    # FILES — not the distro-fedora NAMESPACE, whose candy corpus
    # (charly-marketplace) references the remote opencharly/pod-dsh and would
    # shadow this project's local `dsh` (a validate warning).
    - '@github.com/opencharly/distro-fedora/box/fedora/charly.yml:v2026.256.1134'
    - '@github.com/opencharly/distro-fedora/box/fedora-nonfree/charly.yml:v2026.256.1134'
    - '@github.com/opencharly/distro-fedora/box/fedora-builder/charly.yml:v2026.256.1134'
discover:
    - path: candy
      recursive: true
dsh:
    candy:
        version: 2026.266.2300
        description: |
            Installs the deepseek-harness dsh CLI globally via npm and serves the
            dsh web Web UI (port 3080) as a supervised service. The candy depends
            on nodejs (>=22.19.0 — the dsh floor) and ships a package.json pinning
            @deepseek-ai/dsh 0.1.7-rc.1, which the build installs globally under
            NPM_CONFIG_PREFIX (~/.npm-global). The web app binds 127.0.0.1:3080
            ONLY — dsh-web-app 0.1.7-rc.1 hard-rejects --host 0.0.0.0 (RCE
            safety) — so a charly-owned entrypoint runs `dsh web` in the
            background and exec's a socat forwarder that listens on the
            container's eth0 (0.0.0.0:3081) and forwards to loopback. socat
            cannot share port 3080 (Linux forbids a wildcard + loopback pair on
            one port), so the published port (auto-allocated host port ->
            container 3081) reaches the web UI on the pod substrate. Since
            0.1.5-rc.x the web UI authenticates every request: each process mints
            a random launch token and `dsh web` prints it in its
            `dsh web: http://127.0.0.1:3080/?token=...` readiness line. The
            entrypoint captures that token and persists it to
            $DSH_HOME/web-token (on the dsh volume, so it survives the fresh
            `charly update` rebuild), and the in-box checks authenticate with
            `curl "http://127.0.0.1:3080/?token=$(cat $DSH_HOME/web-token)"`.
            Every fact is observable: the dsh binary at ~/.npm-global/bin/dsh,
            the unpacked package, `dsh --version`/`--help`, node >= 22.19.0, the
            running service, the persisted token file, and the HTTP 200 the
            token-authenticated web UI answers on 127.0.0.1:3080.
        require:
            - '@github.com/opencharly/layer-nodejs:v2026.239.1624'
            - '@github.com/opencharly/layer-supervisord:v2026.240.0121'
        package:
            - socat
        env:
            DSH_HOME: "~/.dsh"
        # The socat forwarder listens on container 3081 (dsh web holds
        # 127.0.0.1:3080; a wildcard + loopback pair cannot share one port on
        # Linux). The deploy auto-allocates the host port; ${HOST_PORT:3081}
        # resolves it in checks.
        port:
            - 3081
        volume:
            - name: dsh
              path: "~/.dsh"
        service:
            - name: dsh
              exec: "%(ENV_HOME)s/.local/bin/dsh-entrypoint"
              restart: always
              working_directory: "%(ENV_HOME)s"
              enable: true
              scope: system
        plan:
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=dsh-entrypoint
              copy: dsh-entrypoint
              to: "${HOME}/.local/bin/dsh-entrypoint"
              mode: "0755"
              run_as: "${USER}"
            - check: the dsh binary is installed into the npm global bin directory
              file:
                file: ${HOME}/.npm-global/bin/dsh
                exists: true
            - check: the dsh package is unpacked under the npm global lib directory
              file:
                file: ${HOME}/.npm-global/lib/node_modules/@deepseek-ai/dsh/package.json
                exists: true
            - check: running dsh --version exits cleanly and prints a semantic version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: ${HOME}/.npm-global/bin/dsh --version
            - check: running dsh --help exits cleanly and lists the web and plugin commands
              exit_status: 0
              stdout:
                - contains: "web"
                - contains: "plugin"
              command: ${HOME}/.npm-global/bin/dsh --help
            - # The dsh harness floor (node ^22.19.0 || >=24.0.0). No `${...}` anywhere:
              # a check step's command goes through charly's variable substitution, which
              # reads `${HOME:-default}` as a variable named `HOME:-default`, fails to
              # resolve it, and SKIPS the step — trading a red check for a silently absent
              # one. `node -e` with single quotes has no `${...}`, so it always runs.
              check: node is at least 22.19.0 (the deepseek-harness dsh floor)
              exit_status: 0
              command: |
                node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (maj<22||(maj===22&&min<19)) process.exit(1)'
            - check: the dsh service is running under the init system
              context:
                - runtime
              service:
                service: dsh
                running: true
            - check: the token-authenticated dsh web UI answers on 127.0.0.1:3080 in-box
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3080/?token=$T"
            - check: the socat forwarder relays the token-authenticated dsh web UI on 127.0.0.1:3081 in-box
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3081/?token=$T"
            - check: the published port reaches the dsh web UI and enforces its auth fence (401 without a token)
              timeout: 30s
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:3081}/
                status: 401

dsh-skill:
    skill:
        name: dsh
        family: tools
        owner: dsh
        description: |-
            DeepSeek Harness (dsh) CLI + web UI via npm with a socat-exposed web service on port 3080.
            Use when working with the dsh candy.
        content: |-
            # dsh -- DeepSeek Harness CLI and web UI

            ## Candy Properties

            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `package.json`, `dsh-entrypoint` |
            | Depends | `nodejs` (>=22.19.0), `supervisord` |
            | Port | 3080 (web UI, loopback) / 3081 (socat forwarder) |
            | Volume | `~/.dsh` (profiles + plugin data + the captured web token) |

            ## Environment Variables

            | Variable | Value |
            |----------|-------|
            | `DSH_HOME` | `~/.dsh` |

            ## Packages

            RPM/DEB/PAC: `socat` (the loopback→eth0 forwarder)

            ## The web UI is loopback-only and token-authenticated

            `dsh web` binds **127.0.0.1:3080 only**: dsh-web-app 0.1.7-rc.1
            hard-rejects `--host 0.0.0.0` (RCE safety). A container's published
            port maps to the container's eth0, not loopback — so the charly-owned
            `dsh-entrypoint` runs `dsh web` in the background and `exec`s a socat
            forwarder (`TCP-LISTEN:3081,fork,reuseaddr TCP:127.0.0.1:3080`) that
            exposes the web app on eth0. socat cannot share port 3080 (Linux
            forbids a wildcard + loopback listener pair on one port), so the
            published port (auto-allocated host port → container 3081) reaches
            the web UI through socat. On the vm substrate the `ssh -L` forward
            targets loopback directly — socat just doesn't hurt there.

            Since dsh-web-app 0.1.5-rc.x the web UI authenticates every request:
            each process mints a random launch token, and `dsh web` prints its
            readiness URL as `dsh web: http://127.0.0.1:3080/?token=...`. There is
            no flag or config that disables authentication. The entrypoint parses
            that token from the readiness line and writes it to
            `$DSH_HOME/web-token` (on the `dsh` volume, so a fresh `charly update`
            rebuild re-captures it); a tokenless `GET /` returns **401**. In-box
            probes authenticate with the token, e.g.
            `curl "http://127.0.0.1:3080/?token=$(cat $DSH_HOME/web-token)"`.

            ## Usage

            ```yaml
            # charly.yml
            my-image:
              candy:
                - dsh
            ```

            ## Used In Boxes

            - Composed on demand; requires a builder that declares the npm builder
              (the mcporter precedent).

            ## Related Candies

            - `/charly-coder:nodejs` -- required runtime dependency (node >=22.19.0)
            - `/charly-tools:mcporter` -- sibling npm-global CLI candy

            ## When to Use This Skill

            Use when the user asks about:

            - The deepseek-harness `dsh` CLI or web UI
            - The `dsh` candy or the `dsh:` check verb
            - The socat forwarder that exposes the loopback-bound web app

            ## Related

            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

# =============================================================================
# dsh-app + check-dsh-pod — the R10 bed for the deepseek-harness dsh candy and
# the compiled-in plugin-dsh management plugin (command:dsh + verb:dsh). Moved
# here from opencharly/charly's charly.yml, which cannot exercise this candy as
# in-development code (the bed's dev-tree override resolves the bed project's own
# superproject, not the candy owner), so the artifact owner tests its own candy
# locally.
#
# The bed builds a minimal Fedora box composing nodejs + the LOCAL dsh candy.
# The npm builder (the local fedora-builder above) installs @deepseek-ai/dsh
# 0.1.7-rc.1 globally; node-pty (a dsh dependency) ships NO linux-x64 prebuild
# in the npm tarball, so its install script falls through to node-gyp — the
# builder's build-toolchain provides gcc/make/python3, and the compiled pty.node
# is N-API (ABI-stable across node versions, so building against the builder's
# node runs on the image's node). The dsh service boots `dsh web` (loopback-only,
# 127.0.0.1:3080) and the charly-owned dsh-entrypoint exec's a socat forwarder
# exposing it on eth0:3081.
# =============================================================================
dsh-app:
    candy:
        version: 2026.266.2300
        base: quay.io/fedora/fedora:43
        description: |-
            The deepseek-harness box: a minimal Fedora base composing the nodejs and
            local dsh candies. The npm builder installs @deepseek-ai/dsh 0.1.7-rc.1
            globally (node-pty's native module builds via node-gyp in the
            fedora-builder's build-toolchain); the dsh service boots the
            loopback-bound, token-authenticated web UI and a socat forwarder exposes
            it on the container's eth0. The candy's checks run in BOTH contexts, so
            `charly check box dsh-app` proves the CLI installs and the node floor
            holds without deploying, and `charly check live` re-proves the same
            shape against the running pod plus the service + web UI.
        # The distro tag chain is load-bearing (the docs-site-app precedent): the
        # package resolver walks the IMAGE's declared chain most-specific-first, so a
        # box that declares `base:` alone matches no per-distro section and silently
        # installs nothing.
        distro:
            - fedora:43
            - fedora
        # The npm builder resolves to this project's LOCAL fedora-builder (above);
        # a namespace-qualified base would contribute no builder map at all.
        builder:
            npm: fedora-builder
        candy:
            - '@github.com/opencharly/layer-nodejs:v2026.239.1624'
            - dsh
check-dsh-pod:
    pod:
        image: dsh-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the deepseek-harness dsh candy + the compiled-in plugin-dsh management plugin. Deploying it to steady state proves the dsh-app box — whose image build ran the npm builder (installing @deepseek-ai/dsh 0.1.7-rc.1 globally, node-pty's native module built via node-gyp) and asserted the CLI + node floor — builds, starts, and stays up with the dsh service running, the entrypoint capturing the web launch token to $DSH_HOME/web-token, the token-authenticated web UI answering in-box on 127.0.0.1:3080 AND through the socat forwarder on 127.0.0.1:3081, the published port enforcing its auth fence, the four dsh: verb methods dispatching in-box, and the compiled-in `charly dsh status` command reaching the deployed box over the pod-lifecycle reverse channel.
        plan:
            - check: the dsh-app pod reached steady state (the dsh box runs)
              id: dsh-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-dsh-pod
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the dsh service is running under the init system in the pod
              id: dsh-service-running
              service:
                service: dsh
                running: true
              context: [runtime]
            - check: the entrypoint persisted the web launch token to $DSH_HOME/web-token
              id: dsh-web-token
              exit_status: 0
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                test -s "$DSH_HOME/web-token" || test -s "$H/.dsh/web-token"
            - check: the token-authenticated dsh web UI answers on 127.0.0.1:3080 in-box
              id: dsh-web-inbox
              timeout: 30s
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3080/?token=$T"
            - check: the socat forwarder relays the token-authenticated dsh web UI on 127.0.0.1:3081 in-box
              id: dsh-web-published
              timeout: 30s
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3081/?token=$T"
            - check: the published port reaches the dsh web UI and enforces its auth fence (401 without a token)
              id: dsh-web-fence
              timeout: 30s
              context: [runtime]
              http:
                http: "http://127.0.0.1:${HOST_PORT:3081}/"
                status: 401
            - check: node is at least 22.19.0 (the deepseek-harness dsh floor)
              id: dsh-node-floor
              exit_status: 0
              context: [runtime]
              command: |
                node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (maj<22||(maj===22&&min<19)) process.exit(1)'
            - check: the dsh version verb reports the dsh version in-box
              id: dsh-verb-version
              dsh:
                method: version
              context: [runtime]
            # dsh-verb-web-running and dsh-cmd-status are owned by plugin-dsh (a
            # SEPARATE repo): verbWebRunning and DshStatusCmd read the launch token
            # the dsh candy's entrypoint persists to $DSH_HOME/web-token and
            # authenticate with ?token=<token>. They were fixed by
            # opencharly/plugin-dsh#5 (MERGED, squash 819f6f9) and pass once that
            # plugin is compiled into the charly build the bed runs (as it is in
            # the R10 run recorded on this PR).
            - check: the dsh web-running verb probes the web UI in-box
              id: dsh-verb-web-running
              dsh:
                method: web-running
              context: [runtime]
            - check: the dsh profile-list verb lists the profiles in-box
              id: dsh-verb-profile-list
              dsh:
                method: profile-list
              context: [runtime]
            - check: the dsh plugin-list verb lists the web profile's plugins in-box
              id: dsh-verb-plugin-list
              dsh:
                method: plugin-list
              context: [runtime]
            - check: the compiled-in charly dsh status command reaches the deployed box over the reverse channel
              id: dsh-cmd-status
              exit_status: 0
              stdout:
                - contains: "web UI: HTTP 200 on 127.0.0.1:3080"
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} dsh status --box check-dsh-pod
                in_container: false
