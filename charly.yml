defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
import:
    # The canonical fedora builder chain, flat-imported so the npm builder
    # carries the RPM Fusion repos (codec-devel packages: ffmpeg-devel /
    # x264-devel) that build-toolchain installs. Flat import of the three box
    # FILES — not the distro-fedora NAMESPACE, whose candy corpus
    # (charly-marketplace) references the remote opencharly/pod-dsh and would
    # shadow this project's local `dsh` (a validate warning).
    - '@github.com/opencharly/distro-fedora/box/fedora/charly.yml:v2026.256.1134'
    - '@github.com/opencharly/distro-fedora/box/fedora-nonfree/charly.yml:v2026.256.1134'
    - '@github.com/opencharly/distro-fedora/box/fedora-builder/charly.yml:v2026.256.1134'
discover:
    - path: candy
      recursive: true
dsh-skill:
    skill:
        name: dsh
        family: tools
        owner: dsh
        description: |-
            DeepSeek Harness (dsh) CLI + loopback web UI via npm with a socat-exposed web service on port 3080.
            Covers the web UI's two-layer auth (launch token + Host/Origin browser-trust fence), the
            `--trusted-host` requirement for reverse-proxy / Tailscale exposure, and the 1:1 port-mapping rule.
            Use when working with the dsh CLI or the dsh-web candy.
        triggers:
            - "The dsh / DeepSeek Harness CLI or web UI, the `dsh` / `dsh-web` candies, `~/.dsh`, the dsh web UI's launch-token + Host/Origin trust fence, `--trusted-host`, exposing dsh web over Tailscale (`tailscale serve`), or `charly dsh status` web health"
        content: |-
            # dsh -- DeepSeek Harness CLI and web UI

            The DeepSeek Harness capability is split across three candies by
            concern (R3):

            - `dsh` — the CLI only (`@deepseek-ai/dsh` 0.2.0-rc.2 via npm).
            - `dsh-web` — the loopback-only, token-authenticated web UI + socat
              forwarder (composes `dsh`).
            - `dsh-tui` — the dsh-TUI terminal-UI plugin + its typed terminal
              channel (composes `dsh`).

            ## Candy Properties (dsh-web)

            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `dsh-entrypoint` |
            | Depends | `dsh`, `nodejs` (>=22.19.0), `supervisord` |
            | Port | 3080 (web UI, loopback) / 3081 (socat forwarder) |
            | Volume | `~/.dsh` (profiles + plugin data + the captured web token) |

            ## Environment Variables

            | Variable | Value |
            |----------|-------|
            | `DSH_HOME` | `~/.dsh` |
            | `DSH_WEB_TRUSTED_HOSTS` | unset/empty by default; a space- or comma-separated list of `host:port` authorities the entrypoint forwards as repeatable `--trusted-host` (set it when the pod is reached through a reverse proxy) |

            A reverse-proxy deployment (`tailscale serve`, an SSH `-L` tunnel) presents a
            non-loopback Host, so without this the shell loads while every `/api/*`
            call returns 403.

            ## Packages

            RPM/DEB/PAC: `socat` (the loopback→eth0 forwarder)

            ## The web UI is loopback-only and token-authenticated

            `dsh web` binds **127.0.0.1:3080 only**: dsh-web-app hard-rejects
            `--host 0.0.0.0` (RCE safety). A container's published
            port maps to the container's eth0, not loopback — so the charly-owned
            `dsh-entrypoint` runs `dsh web` in the background and `exec`s a socat
            forwarder (`TCP-LISTEN:3081,fork,reuseaddr TCP:127.0.0.1:3080`) that
            exposes the web app on eth0. socat cannot share port 3080 (Linux
            forbids a wildcard + loopback listener pair on one port), so the
            published port (auto-allocated host port → container 3081) reaches
            the web UI through socat. On the vm substrate the `ssh -L` forward
            targets loopback directly — socat just doesn't hurt there.

            ## The web UI has TWO independent auth layers

            `dsh web` authenticates at **two** layers, and a probe that only
            checks the first will pass while the browser UI is broken:

            1. **The launch token.** Each process mints a random token and prints
               its readiness URL as `dsh web: http://127.0.0.1:3080/?token=...`.
               There is no flag or config that disables it. `GET /?token=…` on the
               **root only** answers `303` and sets a signed, authority-bound,
               `HttpOnly; SameSite=Strict` cookie whose authority is the *request
               Host* — so it follows the proxy authority rather than staying
               `127.0.0.1`. A missing or wrong-authority cookie returns **401**.

            2. **The Host / Origin browser-trust fence** (`dsh-client-connection`'s
               `api-request-trust`), which every API and WebSocket request passes
               before authentication — including every `/api/*` call the SPA
               makes after the shell loads. The request `Host` must be loopback
               **or** match a `trustedHosts` entry (exact on `host:port`, any port
               on a port-less entry); an attached `Origin` must equal that `Host`;
               `sec-fetch-site: cross-site` is refused. A failed Host check
               returns **403 `forbidden`**; a trusted-but-unauthenticated request
               returns **401 `unauthorized`**. The root `GET /` is the token
               redemption route and is answered by layer 1 first, so a forged Host
               there reads **401, not 403** — the fence is only observable on
               `/api/*`.

            The entrypoint parses the token from the readiness line and writes it
            to `$DSH_HOME/web-token` (on the `dsh` volume, so a fresh
            `charly update` rebuild re-captures it). In-box probes authenticate
            with the token, e.g.
            `curl "http://127.0.0.1:3080/?token=$(cat $DSH_HOME/web-token)"`.

            ## Reaching the web UI through a reverse proxy (e.g. Tailscale)

            Because the app binds loopback only, every off-loopback route is a
            reverse proxy in front of it (`tailscale serve`, an SSH `-L` tunnel,
            an ingress). Such a proxy forwards `Host: <proxy-authority>` — which
            is **neither loopback nor in `trustedHosts`** by default — so the
            shell loads (`/` → 200) but every `/api/*` call returns **403
            forbidden** and the SPA renders an "authentication required" / dead
            page. **`GET /` returning 200 does NOT prove the web UI works; always
            exercise an `/api/*` request.**

            The fix is the repeatable `--trusted-host <authority>` flag
            (`dsh web --trusted-host <proxy-host>:<port>`). Note `lanAddresses`
            is only populated when the bind host is `0.0.0.0`, which `dsh web`
            deliberately is not — so when bound to loopback, only the explicit
            `--trusted-host` entries are trusted. Pass the proxy authority, e.g.:

            ```bash
            # expose the loopback web UI on the tailnet, 1:1, and trust its authority
            dsh --profile web --port 3080 --trusted-host "$(tailscale status --self --json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["Self"]["DNSName"].rstrip("."))'):3080"
            tailscale serve --bg --https=3080 http://127.0.0.1:3080   # 1:1; NOT 443
            ```

            **The exposed URL contract — `https://` and a token.** `--https=3080`
            installs an **HTTPS-only** listener (there is no HTTP one), so a plain
            `http://<self>.ts.net:3080/` is answered by that TLS server with
            **`400 Client sent an HTTP request to an HTTPS server.`** Use
            `https://`. And because `dsh web` authenticates every request, the bare
            `https://<self>.ts.net:3080/` returns **401** — the URL must carry the
            launch token, which redeems it (`303`) and sets the authority-scoped
            cookie. Both together:

            ```bash
            # the working URL (token from the durable file the entrypoint writes)
            https://<self>.ts.net:3080/?token=$(cat ~/.dsh/web-token)
            # or: ~/.local/bin/dsh-web-url [--local|--tailnet] [--open]
            ```

            On a **pod**, the socat forwarder is what makes the published port
            loopback-reaching, so a browser hitting `127.0.0.1:<published>` stays
            on the trusted loopback authority. A pod reached through any
            off-loopback proxy needs the same `--trusted-host` treatment: set the
            `dsh-web` candy's `DSH_WEB_TRUSTED_HOSTS` to the proxy authority
            (`host:port`, space- or comma-separated) and the entrypoint forwards
            each as `--trusted-host`.

            ## Usage

            ```yaml
            # charly.yml
            my-web-box:
              candy:
                - dsh-web   # CLI + web UI
            my-tui-box:
              candy:
                - dsh-tui   # CLI + terminal UI
            ```

            ## Plugins and experimental features (the Plugins page)

            Agent Teams, Auto Authorization Review, Automation tasks, and Voice
            input are **package-bundles**: each is a name in a profile's
            `dsh.profile.bundles` (`$DSH_HOME/profiles/<name>/package.json`). The
            Web sidebar's Plugins page toggles one by writing a `disabled:`
            override into that profile's `cordis.patch.yml` — not by editing the
            bundle list. **Composition is not activation:** `--dump-config` shows
            a bundle was composed; only a boot proves it activated. Check both:

            ```bash
            dsh --profile web --dump-config | grep -E 'agent-team|auto-review|ui-schedule|ui-voice-input'
            dsh --profile web --port 13080 --no-open   # a failed plugin prints "N entries did not activate: <reason>"
            ```

            | Feature | Bundle | web | dsh-tui |
            |---|---|---|---|
            | Agent Teams | `dsh-experimental-agent-team-profile` | ✅ | ❌ |
            | Auto review | `dsh-experimental-auto-review` | ✅ | ❌ |
            | Automation tasks | `dsh-experimental-schedule-bundle` | ✅ | ❌ |
            | Voice input | `dsh-experimental-voice-input-bundle` | ✅ (needs a model) | ❌ |

            - **Agent Teams** runs in `web`/`headless`: the Lead spawns named
              teammates, exchanges durable messages, and uses a shared task board.
              It needs durable session storage (`dsh-session-persistence-jsonl`,
              in `dsh-base`) and is **durable but PROCESS-LOCAL** — all members
              share ONE working directory (no worktree isolation), and there is no
              cross-process/cross-client team.
            - **Voice input** activates but needs a one-time **241 MB** local
              SenseVoice model that `dsh` does NOT pre-fetch — the mic appears,
              and recognition fails until it is prepared. In the UI click
              *Download and prepare*; to pre-seed (sizes + sha256 are pinned in the
              package's `runtime/assets.json`), place the verified files under
              `$DSH_HOME/speech-to-text/sensevoice/models/`:
              `sensevoice-onnx/model.int8.onnx` (239233841 B), `sensevoice-onnx/tokens.txt`
              (315894 B), `silero/silero_vad.onnx` (1807522 B).
            - **The `dsh-tui` profile cannot host these bundles.** The dsh-TUI
              adapter rejects the root capabilities they require —
              `Error: dsh-tui: root.effect is unavailable from a plugin activation`
              — so adding them to the `dsh-tui` profile makes them FAIL to
              activate (`N entries did not activate`). Keep that profile at
              `dsh-base` + `dsh-tui`. The dsh-TUI launcher is standalone (it has
              no remote/attach), so there is **no** Agent-Teams coordination
              between the TUI and the web GUI: team coordination is within one
              Web/headless process, not across the two UIs.

            The `dsh-web` candy **stages the enabled profile** into the `dsh`
            volume at deploy time (a `data:` entry → `$DSH_HOME/profiles/web`), so
            a freshly deployed pod has all four bundles composed without any
            in-UI toggling. The `dsh-tui` candy keeps its profile at base + the
            plugin. This is composition, not activation: the web UI's own boot
            proves the four activate (a failed one prints `N entries did not
            activate`).

            ## Used In Boxes

            - Composed on demand; requires a builder that declares the npm builder
              (the mcporter precedent).

            ## Related Candies

            - `/charly-coder:nodejs` -- required runtime dependency (node >=22.19.0)
            - `/charly-tools:dsh-tui` -- the terminal UI candy (the dsh-TUI plugin)
            - `/charly-tools:mcporter` -- sibling npm-global CLI candy

            ## When to Use This Skill

            Use when the user asks about:

            - The deepseek-harness `dsh` CLI
            - The `dsh-web` candy or the `dsh:` check verb
            - The socat forwarder that exposes the loopback-bound web app

            ## Related

            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)

# =============================================================================
# dsh-app + check-dsh-pod — the R10 bed for the deepseek-harness dsh-web candy
# and the compiled-in plugin-dsh management plugin (command:dsh + verb:dsh).
# Moved here from opencharly/charly's charly.yml, which cannot exercise this
# candy as in-development code (the bed's dev-tree override resolves the bed
# project's own superproject, not the candy owner), so the artifact owner tests
# its own candy locally.
#
# The bed builds a minimal Fedora box composing nodejs + the LOCAL dsh-web candy
# (which composes the `dsh` CLI candy). The npm builder (the local fedora-builder
# above) installs @deepseek-ai/dsh 0.2.0-rc.2 globally; node-pty ships a
# linux-x64 prebuild in the npm tarball, so no node-gyp fallback is needed (the
# builder's build-toolchain still provides gcc/make/python3 if it is). The dsh
# service boots `dsh web` (loopback-only, 127.0.0.1:3080) and the charly-owned
# dsh-entrypoint exec's a socat forwarder exposing it on eth0:3081.
# =============================================================================
dsh-app:
    candy:
        base: quay.io/fedora/fedora:43
        description: |-
            The deepseek-harness box: a minimal Fedora base composing the nodejs and
            local dsh-web candies. The npm builder installs @deepseek-ai/dsh
            0.2.0-rc.2 globally; the dsh service boots the loopback-bound,
            token-authenticated web UI and a socat forwarder exposes it on the
            container's eth0. The candy's checks run in BOTH contexts, so
            `charly check box dsh-app` proves the CLI installs and the node floor
            holds without deploying, and `charly check live` re-proves the same
            shape against the running pod plus the service + web UI.
        # The distro tag chain is load-bearing (the docs-site-app precedent): the
        # package resolver walks the IMAGE's declared chain most-specific-first, so a
        # box that declares `base:` alone matches no per-distro section and silently
        # installs nothing.
        distro:
            - fedora:43
            - fedora
        # The npm builder resolves to this project's LOCAL fedora-builder (above);
        # a namespace-qualified base would contribute no builder map at all.
        builder:
            npm: fedora-builder
        candy:
            - '@github.com/opencharly/layer-nodejs:v2026.272.0322'
            # dsh-web composes the `dsh` CLI candy; the web service is this box's subject.
            - dsh-web
check-dsh-pod:
    pod:
        image: dsh-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the deepseek-harness dsh-web candy + the compiled-in plugin-dsh management plugin. Deploying it to steady state proves the dsh-app box — whose image build ran the npm builder (installing @deepseek-ai/dsh 0.2.0-rc.2 globally) and asserted the CLI + node floor — builds, starts, and stays up with the dsh service running, the entrypoint capturing the web launch token to $DSH_HOME/web-token, the token-authenticated web UI answering in-box on 127.0.0.1:3080 AND through the socat forwarder on 127.0.0.1:3081, the published port enforcing its auth fence, the four dsh: verb methods dispatching in-box, and the compiled-in `charly dsh status` command reaching the deployed box over the pod-lifecycle reverse channel.
        plan:
            - check: the dsh-app pod reached steady state (the dsh box runs)
              id: dsh-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-dsh-pod
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the dsh service is running under the init system in the pod
              id: dsh-service-running
              service:
                service: dsh
                running: true
              context: [runtime]
            - check: the entrypoint persisted the web launch token to $DSH_HOME/web-token
              id: dsh-web-token
              exit_status: 0
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                test -s "$DSH_HOME/web-token" || test -s "$H/.dsh/web-token"
            - check: the token-authenticated dsh web UI answers on 127.0.0.1:3080 in-box
              id: dsh-web-inbox
              timeout: 30s
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3080/?token=$T"
            - check: the socat forwarder relays the token-authenticated dsh web UI on 127.0.0.1:3081 in-box
              id: dsh-web-published
              timeout: 30s
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3081/?token=$T"
            - check: the published port reaches the dsh web UI and enforces its auth fence (401 without a token)
              id: dsh-web-fence
              timeout: 30s
              context: [runtime]
              http:
                http: "http://127.0.0.1:${HOST_PORT:3081}/"
                status: 401
            - check: the web profile is seeded with all four experimental-feature bundles (agent-team, auto-review, schedule, voice)
              id: dsh-web-profile-seeded
              exit_status: 0
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                P="${DSH_HOME:-$H/.dsh}/profiles/web/package.json"
                test -f "$P"
                for b in agent-team-profile auto-review schedule-bundle voice-input-bundle; do
                  grep -q "$b" "$P"
                done
            - check: the web UI's Host-trust fence rejects an untrusted (non-loopback) Host with 403 on /api/*
              id: dsh-web-host-fence
              timeout: 30s
              context: [runtime]
              command: |
                test "$(curl -s -o /dev/null -w '%{http_code}' \
                  -H 'Host: not-trusted.invalid' http://127.0.0.1:3080/api/models)" = 403
            - check: the entrypoint forwards each DSH_WEB_TRUSTED_HOSTS entry as a repeatable --trusted-host — fails if the forwarding branch is removed
              id: dsh-web-trusted-host-forwarded
              timeout: 90s
              context: [runtime]
              command: |
                set -e
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                D="$(mktemp -d)"
                mkdir -p "$D/.npm-global/bin"
                # A fake `dsh` records its argv, prints the readiness line the
                # entrypoint parses, and would exec the socat forwarder we stub
                # below — so the REAL entrypoint runs its exact code path.
                printf '#!/bin/sh\nprintf "%%s\\n" "$@" > "$ARGV_FILE"\necho "dsh web: http://127.0.0.1:3080/?token=fake"\n' > "$D/.npm-global/bin/dsh"
                chmod +x "$D/.npm-global/bin/dsh"
                printf '#!/bin/sh\nexit 0\n' > "$D/socat"
                chmod +x "$D/socat"
                ARGV_FILE="$D/argv" HOME="$D" DSH_HOME="$D/.dsh" \
                  DSH_WEB_TRUSTED_HOSTS="a.invalid:3080,b.invalid:3080" \
                  PATH="$D:$PATH" bash "$H/.local/bin/dsh-entrypoint" </dev/null >/dev/null 2>&1 || true
                grep -qx -- '--trusted-host' "$D/argv"
                grep -qx 'a.invalid:3080' "$D/argv"
                grep -qx 'b.invalid:3080' "$D/argv"
            - check: node is at least 22.19.0 (the deepseek-harness dsh floor)
              id: dsh-node-floor
              exit_status: 0
              context: [runtime]
              command: |
                node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (maj<22||(maj===22&&min<19)) process.exit(1)'
            - check: the dsh version verb reports the dsh version in-box
              id: dsh-verb-version
              dsh:
                method: version
              context: [runtime]
            # dsh-verb-web-running and dsh-cmd-status are owned by plugin-dsh (a
            # SEPARATE repo): verbWebRunning and DshStatusCmd read the launch token
            # the dsh candy's entrypoint persists to $DSH_HOME/web-token and
            # authenticate with ?token=<token>. They were fixed by
            # opencharly/plugin-dsh#5 (MERGED, squash 819f6f9) and pass once that
            # plugin is compiled into the charly build the bed runs (as it is in
            # the R10 run recorded on this PR).
            - check: the dsh web-running verb probes the web UI in-box
              id: dsh-verb-web-running
              dsh:
                method: web-running
              context: [runtime]
            - check: the dsh profile-list verb lists the profiles in-box
              id: dsh-verb-profile-list
              dsh:
                method: profile-list
              context: [runtime]
            - check: the dsh plugin-list verb lists the web profile's plugins in-box
              id: dsh-verb-plugin-list
              dsh:
                method: plugin-list
              context: [runtime]
            - check: the compiled-in charly dsh status command reaches the deployed box over the reverse channel
              id: dsh-cmd-status
              exit_status: 0
              stdout:
                - contains: "web UI: HTTP 200 on 127.0.0.1:3080"
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} dsh status --box check-dsh-pod
                in_container: false

# =============================================================================
# dsh-tui-app + check-dsh-tui-pod — the R10 bed for the dsh-TUI terminal UI.
#
# dsh-tui (https://github.com/ccch1mneyyy/dsh-TUI) is a pure DSH plugin. The box
# composes the nodejs layer + the LOCAL dsh-tui candy (which composes the `dsh`
# CLI candy). The npm builder installs @deepseek-ai/dsh 0.2.0-rc.2 AND
# @deepseek-harness-tui/dsh-tui 0.13.0 globally; the candy adds the plugin to the
# `dsh-tui` profile (`dsh plugin --profile dsh-tui add …`) and publishes a
# terminal_profile + agent_provide tmux channel.
#
# A terminal channel is NOT a long-running service: the typed-terminal route
# launches `dsh-tui` ON DEMAND inside the venue, so the pod has no service of
# its own and must be held at steady-state by check-keepalive's `sleep infinity`
# supervisord program.
# =============================================================================
dsh-tui-app:
    candy:
        base: quay.io/fedora/fedora:43
        description: |-
            The dsh-TUI box: a minimal Fedora base composing the nodejs layer, the
            check-keepalive holder, and the local dsh-tui candy (which composes the
            `dsh` CLI candy). The npm builder installs @deepseek-ai/dsh 0.2.0-rc.2
            and @deepseek-harness-tui/dsh-tui 0.13.0 globally; the candy adds the
            plugin to the `dsh-tui` profile and publishes a typed terminal channel.
            The baked checks run in BOTH contexts: `charly check box dsh-tui-app`
            proves the CLI + plugin install and the node floor without deploying,
            and `charly check live` / `charly check run` re-prove the same shape
            against the running pod plus the terminal channel.
        distro:
            - fedora:43
            - fedora
        # The npm builder resolves to this project's LOCAL fedora-builder (above);
        # a namespace-qualified base would contribute no builder map at all.
        builder:
            npm: fedora-builder
        candy:
            - '@github.com/opencharly/layer-nodejs:v2026.272.0322'
            - '@github.com/opencharly/pod-check-keepalive:v2026.274.0621'
            - dsh-tui
check-dsh-tui-pod:
    pod:
        image: dsh-tui-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the dsh-TUI terminal UI (the dsh-TUI DSH plugin) and the generic typed terminal:tmux channel. Deploying it to steady state proves the dsh-tui-app box — whose image build ran the npm builder (installing @deepseek-ai/dsh 0.2.0-rc.2 and @deepseek-harness-tui/dsh-tui 0.13.0 globally) and added the plugin to the dsh-tui profile — builds, starts, and holds at steady state. The bed asserts the composed image advertises the tmux agent channel and the dsh-tui terminal profile, drives ONE terminal:tmux session (the composer renders — the plugin is mounted; a typed marker echoes — the channel carries input; durable transcript evidence), and then proves the LIVE provider contract with a one-shot in-box `dsh headless` turn on the ollama-cloud route (answer 6158, absent from the prompt). Node floor and the profile manifest are asserted in-box.

            The live provider turn is gated on the real credential (R7a) — it skips VISIBLY when the bed host has no OLLAMA_API_KEY. Driving the interactive composer's submit is keyboard-timing sensitive (a stray Enter can leave the draft in the composer), so the live turn is asserted deterministically via the harness in the same box rather than through the TUI's keystroke path.
        plan:
            - check: the dsh-tui-app pod reached steady state (the keepalive box runs)
              id: dsh-tui-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-dsh-tui-pod
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: node is at least 22.19.0 (the deepseek-harness dsh floor)
              id: dsh-tui-node-floor
              exit_status: 0
              context: [runtime]
              command: |
                node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (maj<22||(maj===22&&min<19)) process.exit(1)'
            - check: the dsh-tui plugin is installed in the dsh-tui profile
              id: dsh-tui-profile-present
              exit_status: 0
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                test -f "$H/.dsh/profiles/dsh-tui/package.json"
                grep -q '@deepseek-harness-tui/dsh-tui' "$H/.dsh/profiles/dsh-tui/package.json"
            - check: the dsh-tui launcher reports the launcher and profile versions (no TTY needed)
              id: dsh-tui-version
              exit_status: 0
              stdout:
                - contains: "0.13.0"
              context: [runtime]
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                "$H/.npm-global/bin/dsh-tui" version
            # The terminal channel: the host drives the TUI inside the pod through
            # the gRPC stdio endpoint. Step A is deterministic (no model call): it
            # launches the detached profile, snapshots the virtual screen, types
            # literal text and reads it back in the composer, and reads durable
            # transcript evidence — proving the channel carries typed input and the
            # TUI reaches its first frame with the plugin mounted.
            - check: the dsh-tui-app image advertises the tmux agent channel and the dsh-tui terminal profile
              id: dsh-tui-channel-labels
              timeout: 60s
              exit_status: 0
              context:
                - runtime
              command:
                in_container: false
                command: |
                    set -eu
                    ${CHARLY_BIN} box labels dsh-tui-app --format agent_provide | grep -q '"provider":"tmux"'
                    ${CHARLY_BIN} box labels dsh-tui-app --format terminal_profiles | grep -q '"dsh-tui"'
            # ONE dsh-TUI session over the tmux terminal channel proves the
            # PLUGIN + CHANNEL: the composer renders (the plugin is mounted in
            # the profile and reachable through the typed terminal route), the
            # channel carries typed input (the marker echoes in the composer),
            # and the durable transcript retains that marker. It does NOT make a
            # model call — the marker is typed WITHOUT submitting.
            #
            # The LIVE provider turn is a separate step (dsh-tui-live-turn): a
            # one-shot in-box `dsh headless` on the same ollama-cloud route,
            # because driving the interactive composer's submit is
            # keyboard-timing racy.
            - check: the dsh-TUI terminal channel renders and carries typed input over the tmux channel
              id: dsh-tui-session
              timeout: 300s
              exit_status: 0
              stdout:
                - contains: DSH-TUI-CHANNEL-OK
              context:
                - runtime
              command:
                in_container: false
                command: |
                    set -eu
                    DIR=$(mktemp -d)
                    LOG="$DIR/commands.log"
                    export CHARLY_AGENT_STATE_DIR="$DIR/state"
                    PROFILE='{"name":"dsh-tui","entrypoint":["dsh-tui"],"cols":140,"rows":44,"keys":["enter","escape","tab"],"persistence":"detach","transcript":"both"}'
                    TARGET=check-dsh-tui-pod
                    # ONE terminal session. A hardcoded --run-id would collide
                    # across the check-live and check-live-rebuild passes and across
                    # retries, so the launch generates a unique id (read back) — the
                    # check-agent-pod precedent.
                    LAUNCHED="$(${CHARLY_BIN} agent terminal launch "$PROFILE" --target "$TARGET" 2>>"$LOG")"
                    printf '%s' "$LAUNCHED" | grep -q '"state":"detached"'
                    RUN="$(printf '%s' "$LAUNCHED" | sed -n 's/.*"run_id":"\([^"]*\)".*/\1/p')"
                    test -n "$RUN"
                    # 1) the plugin mounted: the composer renders. This is the
                    #    channel proof — the dsh-tui plugin is installed in the
                    #    profile and the typed terminal route reaches it.
                    RENDERED=0
                    for i in $(seq 1 30); do
                      sleep 1
                      SNAP="$(${CHARLY_BIN} agent terminal snapshot "$PROFILE" --target "$TARGET" --run-id "$RUN" 2>>"$LOG" || true)"
                      if printf '%s' "$SNAP" | grep -qE 'Say something|deepseek-v4'; then RENDERED=1; break; fi
                    done
                    if [ "$RENDERED" != 1 ]; then
                      echo 'dsh-tui-session: the TUI never rendered the chat composer' >&2
                      printf '%s\n' "$SNAP" >&2 || true
                      cat "$LOG" >&2 || true
                      exit 1
                    fi
                    # 2) the channel carries typed input: a marker echoes in the
                    #    composer (typed WITHOUT submitting — no model call).
                    MARKER="charly-channel-$(( (RANDOM % 90000) + 10000 ))"
                    ${CHARLY_BIN} agent terminal input "$PROFILE" "$MARKER" --target "$TARGET" --run-id "$RUN" 2>>"$LOG"
                    ECHOED=0
                    for i in $(seq 1 25); do
                      sleep 1
                      SNAP="$(${CHARLY_BIN} agent terminal snapshot "$PROFILE" --target "$TARGET" --run-id "$RUN" 2>>"$LOG" || true)"
                      if printf '%s' "$SNAP" | grep -q "$MARKER"; then ECHOED=1; break; fi
                    done
                    if [ "$ECHOED" != 1 ]; then
                      echo 'dsh-tui-session: typed input never reached the TUI composer' >&2
                      printf '%s\n' "$SNAP" >&2 || true
                      cat "$LOG" >&2 || true
                      exit 1
                    fi
                    # Durable transcript evidence for the typed marker.
                    ${CHARLY_BIN} agent terminal transcript "$RUN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const text=JSON.parse(s).map(f=>(f.data?Buffer.from(f.data,"base64").toString():"")+(f.snapshot||"")).join("\n");if(!text.includes(process.argv[1]))process.exit(1)})' "$MARKER"
                    ${CHARLY_BIN} agent terminal close "$PROFILE" --target "$TARGET" --run-id "$RUN" 2>>"$LOG" || true
                    echo DSH-TUI-CHANNEL-OK
            # The live model turn, proven with a ONE-SHOT in-box `dsh headless`
            # call rather than by driving the interactive composer. The TUI's
            # submit path is keyboard-timing sensitive (a stray Enter can leave the
            # draft in the composer), so the live provider contract is asserted
            # deterministically here: the harness in the SAME box, using the SAME
            # ollama-cloud route and credential store, answers a real turn. The
            # answer 6158 is absent from the prompt, so a match can only come from
            # the model.
            #
            # R7a: the real provider is called, or the step SKIPS VISIBLY when no
            # OLLAMA_API_KEY is on the bed host. The key is delivered into the pod
            # via `charly cp` (the sanctioned path — a bed's own run: step is
            # verify-only and skipped).
            - check: the harness in the box answers a live ollama-cloud turn (one-shot dsh headless), or skips when no key is present
              id: dsh-tui-live-turn
              timeout: 300s
              exit_status: 0
              stdout:
                - contains: "6158"
              context:
                - runtime
              command:
                in_container: false
                command: |
                    set -eu
                    # Resolve the credential on the HOST. Do NOT write a shell
                    # default-expansion for the variable name here: a check step's
                    # command is variable-substituted (comments included), and an
                    # OLLAMA_API_KEY shell-default token would be read as an
                    # unresolved variable and SKIP the whole step.
                    KEY="$(printenv OLLAMA_API_KEY || true)"
                    if [ -z "$KEY" ] && [ -f "$HOME/.dsh/.env" ]; then
                      KEY="$(sed -n 's/^OLLAMA_API_KEY=//p' "$HOME/.dsh/.env" | tail -1)"
                    fi
                    if [ -z "$KEY" ]; then
                      echo "DSH-TUI-LIVE-SKIP: OLLAMA_API_KEY not present on the bed host; the live provider turn is skipped (the install + channel checks above still stand)" >&2
                      echo DSH-TUI-LIVE-SKIP
                      exit 0
                    fi
                    DIR=$(mktemp -d)
                    printf 'OLLAMA_API_KEY=%s\n' "$KEY" > "$DIR/.env"
                    chmod 600 "$DIR/.env"
                    TARGET=check-dsh-tui-pod
                    ${CHARLY_BIN} cp "$TARGET" "$DIR/.env" :/home/user/.dsh/.env
                    ${CHARLY_BIN} cmd "$TARGET" 'H=/home/user; export PATH="$H/.npm-global/bin:$PATH"; export DSH_HOME="$H/.dsh"; dsh headless "Compute 6153 plus 5. Answer with only the numeral."'

dsh-tui-skill:
    skill:
        name: dsh-tui
        family: tools
        owner: dsh
        description: |-
            The dsh-TUI terminal UI plugin for DeepSeek Harness (dsh) — a pure DSH plugin
            installed into the dsh-tui profile, launched by the `dsh-tui` / `dst` launcher,
            and exposed as a typed terminal:tmux channel.
            Covers the deterministic first-launch pre-record plus the terminal-channel
            driving contract (unique run-ids, transcript-not-snapshot capture, the
            interactive-submit race) used by the check-dsh-tui-pod R10 bed.
            Use when working with the dsh-TUI terminal UI.
        triggers:
            - "The dsh-TUI / dsh-tui terminal UI plugin (`@deepseek-harness-tui/dsh-tui`), the `dsh-tui` / `dst` launcher, the `dsh-tui` dsh profile, `DSH_TUI_NO_LAUNCHPAD`, the terminal:tmux channel, or the check-dsh-tui-pod bed"
        content: |-
            # dsh-tui -- the DeepSeek Harness terminal UI plugin

            `dsh-TUI` (https://github.com/ccch1mneyyy/dsh-TUI, npm
            `@deepseek-harness-tui/dsh-tui`) is a **pure DSH plugin**, not a
            daemon. It is added to a dsh *profile* and launched by the shipped
            `dsh-tui` / `dst` launcher (or `dsh --profile dsh-tui`). The candy
            `dsh-tui` composes the `dsh` CLI candy and adds the plugin + a typed
            terminal channel.

            ## Candy Properties

            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `package.json` |
            | Depends | `dsh` (the CLI candy), `layer-tmux` |
            | Env | `DSH_TUI_NO_LAUNCHPAD=1` (boot straight to the composer) |
            | Channel | `terminal_profile: dsh-tui` + `agent_provide: tmux` |
            | Profile | `$DSH_HOME/profiles/dsh-tui` (auto-bootstrapped on first launch) |

            ## Deterministic first launch

            The first-run wizard is pre-recorded at `~/.dsh-tui/onboarding.json`
            (`{"completed":true,"version":1}`) and the launchpad is disabled
            (`DSH_TUI_NO_LAUNCHPAD=1`), so the process lands directly on the chat
            screen with no keyboard-owning dialog — the state a terminal channel
            can drive. Without both, an ordinary launch opens the wizard or the
            launchpad, which own the keyboard.

            ## The terminal channel

            The candy publishes a `terminal_profile` (entrypoint `dsh-tui`) and an
            `agent_provide: {provider: tmux, profiles: [dsh-tui]}` capability. A
            disposable bed or a host controller drives it through
            `charly agent terminal launch/snapshot/input/key/transcript`. A
            terminal channel is **on-demand**, not a long-running service: a
            service-less box that carries it must be held at steady state by
            `check-keepalive`'s `sleep infinity` supervisord program.

            ## Driving the channel deterministically

            The channel is a real terminal, so it must be driven the way a
            terminal behaves — not the way a service does:

            - **Unique run-ids.** `launch`/`input`/`snapshot`/`close` are keyed by
              `--run-id`. A hardcoded run-id collides when `check-live` and
              `check-live-rebuild` run the same plan in one session; derive a
              fresh id per step (a `uuidgen`/`date +%s%N`-style value), never a
              literal.
            - **`snapshot` is a render of the viewport, so it is scroll/cursor
              dependent** — a text that scrolled off is gone. To assert content,
              read the durable **`transcript`** (the full session log), not a
              snapshot taken at an arbitrary moment.
            - **`close` closes the control channel, not the process.** The TUI
              keeps running under tmux after a `close`; do not rely on `close` to
              reap it, and never launch a second session against the same target
              while a first is still attached — two concurrent control sessions on
              one pod contend for the same tmux server.
            - **The interactive submit is keyboard-timing racy.** Typing a prompt
              and injecting the submit key can race the TUI's redraw, so a
              pass/fail that depends on the enter landing is flaky by
              construction. An interactive TUI's *liveness* is proven by the
              channel (`launch` → non-empty `transcript` → `close`); the live
              model turn it fronts is asserted separately with a one-shot,
              non-interactive `dsh --headless` call in the same box.

            ## Usage

            ```yaml
            # charly.yml
            my-tui-box:
              candy:
                - dsh-tui
            ```

            ```bash
            charly start my-tui-box
            # drive the TUI through the channel:
            charly agent terminal launch '{"name":"dsh-tui","entrypoint":["dsh-tui"],"cols":140,"rows":44,"keys":["enter"]}' --target my-tui-box --run-id <uuid>
            ```

            ## Related

            - `/charly-tools:dsh` -- the CLI + web-UI candy family (`dsh`, `dsh-web`)
            - `/charly-check:check` — the R10 bed `check-dsh-tui-pod`
            - `/charly-image:layer` — candy authoring reference
