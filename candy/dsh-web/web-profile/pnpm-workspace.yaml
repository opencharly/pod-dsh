packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# pnpm >= 10 blocks dependency build/install scripts unless explicitly allowed.
# The four community/native plugins are vendored prebuilt `file:` deps
# (vendor-tgz/), so they need no build key here; only the two NATIVE bits build
# — `ssh2`'s optional crypto binding and `cpu-features` (the ~0.0.10 package
# ships no prebuild).
#
# Keyed by BARE NAME, which works on BOTH pnpm 10.33.4 and 10.34.6 (the layer-
# nodejs pin), so this file is portable across it. A git-specifier key would
# instead need the fully-qualified form on 10.34.6 and fail on 10.33.4 with
# ERR_PNPM_INVALID_VERSION_UNION — the coupling recorded in
# opencharly/layer-nodejs#5. It is moot here now that no git dep remains (the
# plugins are `file:` deps).
allowBuilds:
  cpu-features: true
  ssh2: true

# ssh2's bundled optional crypto binding does not compile against Node >= 26
# (binding.cc calls `context->GetIsolate()`, removed from V8). Without this the
# binding merely fails to build and ssh2 silently falls back to pure JS; with it
# the native AES-GCM/ChaCha20-Poly1305 paths are available. The patch is
# local-only, so it is unaffected by the git pins above.
patchedDependencies:
  ssh2@1.17.0: patches/ssh2@1.17.0.patch
