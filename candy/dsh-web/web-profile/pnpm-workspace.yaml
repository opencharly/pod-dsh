packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# No allowBuilds / patchedDependencies remain: the only native dependency was
# ssh2 (plus its cpu-features optional binding), pulled in by the
# dsh-workspace-enhancement plugin, which this profile no longer composes
# (2026-10-09). Every remaining dependency is either a prebuilt vendored
# `file:` tarball or a pure-JS registry package, so nothing needs a build key.
