packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# pnpm >= 10 blocks dependency build/install scripts unless explicitly allowed.
# A DSH profile installs its bundles from this file: the git-hosted community
# plugins build via their `prepare`, and the native bits (`ssh2`'s optional
# crypto binding, `cpu-features`) build here too.
#
# Keyed by BARE NAME. pnpm 10.34.6 accepts the fully-qualified git specifier it
# prints for the git-hosted plugins, but pnpm 10.33.4 rejects that form with
# ERR_PNPM_INVALID_VERSION_UNION; a bare name matches the git-hosted dep on BOTH
# 10.33.4 and 10.34.6, so this file is portable across the layer-nodejs pin.
allowBuilds:
  cpu-features: true
  ssh2: true

# ssh2's bundled optional crypto binding does not compile against Node >= 26
# (binding.cc calls `context->GetIsolate()`, removed from V8). Without this the
# binding merely fails to build and ssh2 silently falls back to pure JS; with it
# the native AES-GCM/ChaCha20-Poly1305 paths are available. The patch is
# local-only, so it is unaffected by the git pins above.
patchedDependencies:
  ssh2@1.17.0: patches/ssh2@1.17.0.patch
