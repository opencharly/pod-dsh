# The dsh-web candy — the DeepSeek Harness web UI (loopback-only) plus the
# socat forwarder that exposes it on the container's eth0.
#
# Concern split (R3): this candy composes the `dsh` CLI candy and adds ONLY the
# web service. The CLI install lives in candy/dsh; the terminal UI in
# candy/dsh-tui.
dsh-web:
    candy:
        description: |
            Serves the DeepSeek Harness web Web UI (port 3080) as a supervised
            service. The web app binds 127.0.0.1:3080 ONLY — dsh-web-app
            0.2.0-rc.2 hard-rejects --host 0.0.0.0 (RCE safety) — so a
            charly-owned entrypoint runs `dsh web` in the background and
            exec's a socat forwarder that listens on the container's eth0
            (0.0.0.0:3081) and forwards to loopback. socat cannot share port
            3080 (Linux forbids a wildcard + loopback pair on one port), so the
            published port (auto-allocated host port -> container 3081) reaches
            the web UI on the pod substrate. The web UI authenticates at TWO
            layers: (1) a per-process random launch token that `dsh web` prints
            in its `dsh web: http://127.0.0.1:3080/?token=...` readiness line
            (captured by the entrypoint to $DSH_HOME/web-token, on the dsh
            volume, so it survives the fresh `charly update` rebuild), and
            (2) a Host/Origin browser-trust fence gating every request including
            `/api/*`. The default deployment is reached on loopback
            (`127.0.0.1:3080` in-box, `127.0.0.1:<host-port>` through socat), which
            the fence trusts. To expose the pod behind a reverse proxy
            (`tailscale serve`, an SSH `-L` tunnel), set `DSH_WEB_TRUSTED_HOSTS`
            to the proxy authority (`host:port`) so the entrypoint adds
            `--trusted-host`; without it every `/api/*` call returns 403 and the
            SPA renders a dead page even though `/` returns 200.
            The candy seeds the web profile with the full experimental-feature
            set AND the community `dsh-git-worktree` plugin AND the native
            `dsh-opencharly` plugin (git gates, SOUL injection, watch auto-arm).
            The two plugins are VENDORED PREBUILT under
            `web-profile/vendor-tgz/` and consumed as `file:` deps — so the profile
            install resolves them OFFLINE (no codeload fetch, no per-dep npm-
            install bootstrap), which is what a reproducible candy needs. The
            four shipped optional bundles are Agent Teams (agent-team-profile),
            Auto review, Schedule/Automation tasks, and Voice input.
            The manifest (with its vendored tarballs) is staged into the dsh volume at
            deploy time (the notebook-templates `data:` pattern); because profile
            bundles resolve from `$DSH_HOME/profiles/web/node_modules` and a named
            `dsh` volume shadows the image's build-time ~/.dsh, the candy installs
            the profile at BUILD time into the durable ~/.local/share/dsh/
            profile-home (every remaining dep is a prebuilt vendored tarball or
            pure JS — nothing compiles), and the entrypoint seeds
            the volume from it on first boot. The ollama-cloud LLM route (shipped
            by the shared `dsh` candy) is restored the same way from the durable
            ~/.local/share/dsh copy.
            Every fact is observable: the running service, the persisted token
            file, the seeded profile manifest listing all eight bundles (base,
            web-app, the four experimental features, the community
            dsh-git-worktree plugin, and the native dsh-opencharly plugin) plus the installed
            node_modules and the route, and the HTTP 200 the token-authenticated
            web UI answers on 127.0.0.1:3080.
        require:
            - dsh
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
        package:
            # socat: the loopback->eth0 forwarder.
            # libatomic: pnpm's managed package-manager runtime is a prebuilt
            # binary linked against libatomic.so.1 — absent from a minimal Fedora,
            # so an install dies with "error while loading shared libraries".
            #
            # No native toolchain (gcc/g++/make/python3/node-gyp) and NOT golang:
            # both remaining plugins are VENDORED prebuilt as tarballs under
            # web-profile/vendor-tgz/ (`file:` deps), so nothing compiles or builds
            # a Go core at install time.
            - socat
            - libatomic
        env:
            DSH_HOME: "~/.dsh"
            DSH_WEB_TRUSTED_HOSTS: ""
        # The socat forwarder listens on container 3081 (dsh web holds
        # 127.0.0.1:3080; a wildcard + loopback pair cannot share one port on
        # Linux). The deploy auto-allocates the host port; ${HOST_PORT:3081}
        # resolves it in checks.
        port:
            - 3081
        volume:
            - name: dsh
              path: "~/.dsh"
        # Stage the full experimental-feature web profile into the dsh volume at
        # deploy time. `src` is relative to THIS candy dir; the generator stages
        # it to /data/dsh/profiles/web (volume + dest) in the image, and the
        # runtime seeder copies it into the EMPTY `dsh` named volume at
        # profiles/web. The set is the four shipped bundles dsh offers
        # switched-off (app-boot OPTIONAL_BUNDLES): Agent Teams, Auto review,
        # Schedule/Automation tasks, and Voice input. The manifest also carries
        # the community dsh-git-worktree plugin (vendored prebuilt as a tarball
        # under web-profile/vendor-tgz) and the native dsh-opencharly plugin. The
        # candy installs the profile at
        # BUILD time so `node_modules` (the vendored plugins' `lib/`) is present
        # with no network at run time. charly's `data:`
        # seeder is `initial` (it gates on the volume being empty), so a user's
        # later profile edits are kept; the entrypoint seeds the installed tree on
        # first boot from the durable ~/.local/share/dsh/profile-home copy (the
        # volume shadows the image's ~/.dsh, so the baked tree is unreachable from
        # the volume path).
        data:
            - src: web-profile
              volume: dsh
              dest: profiles/web
        service:
            - name: dsh
              exec: "%(ENV_HOME)s/.local/bin/dsh-entrypoint"
              restart: always
              working_directory: "%(ENV_HOME)s"
              enable: true
              scope: system
        plan:
            - # Install the web profile (manifest + node_modules) into a durable
              # location OUTSIDE the named dsh volume, which shadows ~/.dsh at run
              # time. The manifest is the `data:` payload staged at
              # /data/dsh/profiles/web; the two plugins are
              # VENDORED PREBUILT as tarballs under vendor-tgz/ and consumed as `file:` deps, so
              # the install resolves them OFFLINE — no codeload fetch, no per-dep
              # npm-install bootstrap, and nothing compiles. Done here, at build
              # time, so a fresh container
              # needs no network. DSH_HOME must point at the staging parent so
              # `dsh plugin` resolves the same profile dir the entrypoint seeds.
              run: install the web profile (bundles + vendored plugins) into a durable, non-volume path
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                export PATH="$H/.npm-global/bin:$PATH"
                S="$H/.local/share/dsh/profile-home"
                rm -rf "$S"
                mkdir -p "$S/profiles/web"
                cp -a /data/dsh/profiles/web/. "$S/profiles/web/"
                DSH_HOME="$S" "$H/.npm-global/bin/dsh" plugin --profile web install
              run_as: "${USER}"
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=dsh-entrypoint
              copy: dsh-entrypoint
              to: "${HOME}/.local/bin/dsh-entrypoint"
              mode: "0755"
              run_as: "${USER}"
            - check: the dsh service is running under the init system
              context:
                - runtime
              service:
                service: dsh
                running: true
            - check: the token-authenticated dsh web UI answers on 127.0.0.1:3080 in-box
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3080/?token=$T"
            - check: the socat forwarder relays the token-authenticated dsh web UI on 127.0.0.1:3081 in-box
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3081/?token=$T"
            - check: the published port reaches the dsh web UI and enforces its auth fence (401 without a token)
              timeout: 30s
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:3081}/
                status: 401
            - check: the web profile is seeded with all four experimental-feature bundles, the community dsh-git-worktree plugin, the native dsh-opencharly plugin, and the volume's ollama-cloud route
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                D="$DSH_HOME"
                [ -n "$D" ] || D="$H/.dsh"
                P="$D/profiles/web/package.json"
                test -f "$P"
                for b in agent-team-profile auto-review schedule-bundle voice-input-bundle dsh-git-worktree dsh-opencharly; do
                  grep -q "$b" "$P"
                done
                # The two dropped community plugins must NOT come back: a revert
                # that re-lists either bundle in the seeded manifest FAILS here.
                ! grep -qE '@perrylink/dsh-github|dsh-workspace-enhancement' "$P"
                grep -q "ollama-cloud" "$D/cordis.patch.yml"
            - check: the web profile resolves the two plugins OFFLINE from the vendored tarballs (fails if reverted to the git deps)
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                D="$DSH_HOME"
                [ -n "$D" ] || D="$H/.dsh"
                P="$D/profiles/web/package.json"
                # Every plugin dep is a file: dep on a vendored tarball — no
                # `github:`/`git+`/`codeload` specifier survives. A revert to the
                # git deps names the plugin but not this path, so it FAILS here.
                test "$(grep -c '"file:./vendor-tgz/' "$P")" = 2
                ! grep -qE '"(github|git\+|https?):' "$P"
                # The vendored tarballs are present and their bytes match the
                # committed manifest (SHA256SUMS sits beside them).
                cd "$D/profiles/web/vendor-tgz"
                sha256sum -c SHA256SUMS
            - check: the web profile's node_modules carries both vendored plugins' built lib/ (so the DSH loader can import them)
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                D="$DSH_HOME"
                [ -n "$D" ] || D="$H/.dsh"
                N="$D/profiles/web/node_modules"
                test -f "$N/dsh-git-worktree/lib/index.js"
                test -f "$N/dsh-opencharly/lib/index.js"
