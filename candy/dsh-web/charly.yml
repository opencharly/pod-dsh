# The dsh-web candy — the DeepSeek Harness web UI (loopback-only) plus the
# socat forwarder that exposes it on the container's eth0.
#
# Concern split (R3): this candy composes the `dsh` CLI candy and adds ONLY the
# web service. The CLI install lives in candy/dsh; the terminal UI in
# candy/dsh-tui.
dsh-web:
    candy:
        description: |
            Serves the DeepSeek Harness web Web UI (port 3080) as a supervised
            service. The web app binds 127.0.0.1:3080 ONLY — dsh-web-app
            0.2.0-rc.2 hard-rejects --host 0.0.0.0 (RCE safety) — so a
            charly-owned entrypoint runs `dsh web` in the background and
            exec's a socat forwarder that listens on the container's eth0
            (0.0.0.0:3081) and forwards to loopback. socat cannot share port
            3080 (Linux forbids a wildcard + loopback pair on one port), so the
            published port (auto-allocated host port -> container 3081) reaches
            the web UI on the pod substrate. The web UI authenticates at TWO
            layers: (1) a per-process random launch token that `dsh web` prints
            in its `dsh web: http://127.0.0.1:3080/?token=...` readiness line
            (captured by the entrypoint to $DSH_HOME/web-token, on the dsh
            volume, so it survives the fresh `charly update` rebuild), and
            (2) a Host/Origin browser-trust fence gating every request including
            `/api/*`. The default deployment is reached on loopback
            (`127.0.0.1:3080` in-box, `127.0.0.1:<host-port>` through socat), which
            the fence trusts. To expose the pod behind a reverse proxy
            (`tailscale serve`, an SSH `-L` tunnel), set `DSH_WEB_TRUSTED_HOSTS`
            to the proxy authority (`host:port`) so the entrypoint adds
            `--trusted-host`; without it every `/api/*` call returns 403 and the
            SPA renders a dead page even though `/` returns 200.
            The candy seeds the web profile with the full experimental-feature
            set AND the three git-hosted community plugins (the opencharly forks)
            — the four shipped optional bundles Agent Teams (agent-team-profile),
            Auto review, Schedule/Automation tasks, and Voice input, plus
            @perrylink/dsh-github, dsh-git-worktree, and dsh-workspace-enhancement.
            The manifest is staged into the dsh volume at deploy time (the
            notebook-templates `data:` pattern); because profile bundles resolve
            from `$DSH_HOME/profiles/web/node_modules` and a named `dsh` volume
            shadows the image's build-time ~/.dsh, the candy installs the profile
            at BUILD time into the durable ~/.local/share/dsh/profile-home (gcc/
            make/python3 build the git plugins' `prepare` and the optional ssh2
            crypto binding), and the entrypoint seeds the volume from it on first
            boot. The ollama-cloud LLM route (shipped by the shared `dsh` candy) is
            restored the same way from the durable ~/.local/share/dsh copy.
            Every fact is observable: the running service, the persisted token
            file, the seeded profile manifest listing all nine bundles (base,
            web-app, the four experimental features, and the three community
            plugins) plus the installed node_modules and the route, and the HTTP
            200 the token-authenticated web UI answers on 127.0.0.1:3080.
        require:
            - dsh
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
        package:
            # socat: the loopback->eth0 forwarder.
            # gcc/g++/make/python3: the profile install runs node-gyp for ssh2's
            # optional crypto binding and cpu-features (~0.0.10 ships no prebuild);
            # pnpm aborts on a non-zero allowed build script. (NOT
            # layer-build-toolchain — that drags cargo/ffmpeg-devel/wayland-devel
            # into a web image.)
            # libatomic: pnpm's managed package-manager runtime (the version a
            # git-hosted plugin pins in its `packageManager` field) is a prebuilt
            # binary linked against libatomic.so.1 — absent from a minimal Fedora,
            # so `prepare` dies with "error while loading shared libraries".
            # golang: `dsh-workspace-enhancement` builds its fenced `dsh-core`
            # Go binary at install (a git install ships no prebuilt tarball —
            # `core/dist` is gitignored by design and built by CI for npm), and
            # its install fails hard when `go` is absent.
            - socat
            - gcc
            - gcc-c++
            - make
            - python3
            - libatomic
            - golang
        env:
            DSH_HOME: "~/.dsh"
            DSH_WEB_TRUSTED_HOSTS: ""
        # The socat forwarder listens on container 3081 (dsh web holds
        # 127.0.0.1:3080; a wildcard + loopback pair cannot share one port on
        # Linux). The deploy auto-allocates the host port; ${HOST_PORT:3081}
        # resolves it in checks.
        port:
            - 3081
        volume:
            - name: dsh
              path: "~/.dsh"
        # Stage the full experimental-feature web profile into the dsh volume at
        # deploy time. `src` is relative to THIS candy dir; the generator stages
        # it to /data/dsh/profiles/web (volume + dest) in the image, and the
        # runtime seeder copies it into the EMPTY `dsh` named volume at
        # profiles/web. The set is the four shipped bundles dsh offers
        # switched-off (app-boot OPTIONAL_BUNDLES): Agent Teams, Auto review,
        # Schedule/Automation tasks, and Voice input. The manifest also carries
        # the three git-hosted community plugins (the opencharly forks), and the
        # candy installs the profile at BUILD time so `node_modules` (the git
        # plugins' built `lib/`, the optional ssh2 crypto binding) is present with
        # no network at run time. charly's `data:` seeder is `initial` (it gates on
        # the volume being empty), so a user's later profile edits are kept; the
        # entrypoint seeds the installed tree on first boot from the durable
        # ~/.local/share/dsh/profile-home copy (the volume shadows the image's
        # ~/.dsh, so the baked tree is unreachable from the volume path).
        data:
            - src: web-profile
              volume: dsh
              dest: profiles/web
        service:
            - name: dsh
              exec: "%(ENV_HOME)s/.local/bin/dsh-entrypoint"
              restart: always
              working_directory: "%(ENV_HOME)s"
              enable: true
              scope: system
        plan:
            - # ssh2's optional crypto binding and cpu-features build their native
              # addons with a bare `node-gyp` on PATH. A minimal Fedora has no
              # node-gyp RPM and npm does not expose its bundled copy, so without
              # this the native bits silently fail to build (ssh2 falls back to
              # pure JS) rather than erroring.
              run: install node-gyp globally for the profile's native addon builds
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                export PATH="$H/.npm-global/bin:$PATH"
                npm install -g node-gyp
                command -v node-gyp
              run_as: "${USER}"
            - # Install the web profile (manifest + node_modules) into a durable
              # location OUTSIDE the named dsh volume, which shadows ~/.dsh at run
              # time. The manifest is the `data:` payload staged at
              # /data/dsh/profiles/web; the install builds the git-hosted community
              # plugins' `lib/` (their `prepare`) and the optional ssh2 crypto
              # binding (node-gyp, installed just above, over the gcc/make the
              # candy declares). Done here, at build time, so a fresh container
              # needs no network. DSH_HOME must point at the staging parent so
              # `dsh plugin` resolves the same profile dir the entrypoint seeds.
              run: install the web profile (bundles + git-hosted plugins) into a durable, non-volume path
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                export PATH="$H/.npm-global/bin:$PATH"
                S="$H/.local/share/dsh/profile-home"
                rm -rf "$S"
                mkdir -p "$S/profiles/web"
                cp -a /data/dsh/profiles/web/. "$S/profiles/web/"
                DSH_HOME="$S" "$H/.npm-global/bin/dsh" plugin --profile web install
              run_as: "${USER}"
            - run: mkdir=${HOME}/.local/bin
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: copy=dsh-entrypoint
              copy: dsh-entrypoint
              to: "${HOME}/.local/bin/dsh-entrypoint"
              mode: "0755"
              run_as: "${USER}"
            - check: the dsh service is running under the init system
              context:
                - runtime
              service:
                service: dsh
                running: true
            - check: the token-authenticated dsh web UI answers on 127.0.0.1:3080 in-box
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3080/?token=$T"
            - check: the socat forwarder relays the token-authenticated dsh web UI on 127.0.0.1:3081 in-box
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                T="$(cat "$DSH_HOME/web-token" 2>/dev/null || cat "$H/.dsh/web-token")"
                curl -fsS -o /dev/null "http://127.0.0.1:3081/?token=$T"
            - check: the published port reaches the dsh web UI and enforces its auth fence (401 without a token)
              timeout: 30s
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:3081}/
                status: 401
            - check: the web profile is seeded with all four experimental-feature bundles, the three community plugins, and the volume's ollama-cloud route
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                D="$DSH_HOME"
                [ -n "$D" ] || D="$H/.dsh"
                P="$D/profiles/web/package.json"
                test -f "$P"
                for b in agent-team-profile auto-review schedule-bundle voice-input-bundle @perrylink/dsh-github dsh-git-worktree dsh-workspace-enhancement; do
                  grep -q "$b" "$P"
                done
                grep -q "ollama-cloud" "$D/cordis.patch.yml"
            - check: the web profile's node_modules is installed (the git-hosted community plugins built their lib/, so the DSH loader can import them)
              timeout: 30s
              context:
                - runtime
              command: |
                H="$(getent passwd "$(id -u)" | cut -d: -f6)"
                D="$DSH_HOME"
                [ -n "$D" ] || D="$H/.dsh"
                N="$D/profiles/web/node_modules"
                test -f "$N/@perrylink/dsh-github/lib/client.js"
                test -f "$N/dsh-git-worktree/lib/index.js"
                test -f "$N/dsh-workspace-enhancement/lib/index.js"
