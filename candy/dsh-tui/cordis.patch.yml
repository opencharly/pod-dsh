# dsh home-level patch — applied to EVERY profile (web, dsh-tui, …).
#
# ollama-cloud: a hand-declared OpenAI-compatible gateway route. This mirrors
# the opencode `ollama-cloud` provider (https://ollama.com/v1, key
# OLLAMA_API_KEY) with the full 24-model catalog. pi-ai ships no ollama catalog
# entry, so the route declares api + baseURL + a non-empty models list — the
# documented dsh-llm-pi-ai hand-declared-gateway path.
#
# The API key is NOT in this file: it resolves per request through the dsh
# credential store (the launch environment, the store, a project .env, or
# ~/.dsh/.env). A provider turn requires the key to be present there; the candy
# neither ships nor declares it.
- id: llm-pi-ai
  config:
    providers:
      ollama-cloud:
        displayName: Ollama Cloud
        api: openai-completions
        baseURL: https://ollama.com/v1
        apiKeyEnv: OLLAMA_API_KEY
        defaultContextWindow: 262144
        defaultMaxTokens: 32768
        models:
          - id: deepseek-v4-flash
            name: "deepseek-v4-flash"
            contextWindow: 1048576
            maxTokens: 1048576
